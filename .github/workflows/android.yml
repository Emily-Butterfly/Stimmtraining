name: APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # für das Veröffentlichen der APK als Release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Signatur-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.STIMM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stimmtraining.jks"
            echo "STIMM_KEYSTORE_FILE=$RUNNER_TEMP/stimmtraining.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=Kein fester Signatur-Schlüssel::Ohne das Secret STIMM_KEYSTORE_BASE64 hat jede APK einen anderen Schlüssel. Updates gehen dann nur nach Deinstallation (vorher Backup machen!). Siehe README."
          fi

      - name: Tests ausführen und APK bauen
        env:
          STIMM_KEYSTORE_PASSWORD: ${{ secrets.STIMM_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Stimmtraining-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Stimmtraining-1.0.${{ github.run_number }}
          path: Stimmtraining-*.apk

      - name: Als Release veröffentlichen
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          # Bei "Re-run" gibt es das Release schon; dann nur die APK ersetzen.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Stimmtraining-*.apk --clobber
          else
            gh release create "$TAG" Stimmtraining-*.apk \
              --target "${{ github.sha }}" \
              --title "Stimmtraining 1.0.${{ github.run_number }}" \
              --notes "Zum Installieren die APK auf dem Handy herunterladen und öffnen. Vor einem Update mit neuem Signatur-Schlüssel bitte zuerst in der App ein Backup erstellen."
          fi
